apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-plc
  namespace: discord-bot
  labels:
    app.kubernetes.io/name: bot-plc
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: bot-plc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bot-plc
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      dnsPolicy: ClusterFirst
      containers:
        - name: bot-plc
          image: "ghcr.io/plc-btsio/discord-bot-plc:1.1.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 75m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: DEBUG_MODE
              value: "INFO"
            - name: LOG_CHANNEL_ID
              value: "1543300697481551943"
            - name: IDEA_CHANNEL_ID
              value: "1543299818036666529"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bot-plc-secrets
                  key: DISCORD_BOT_TOKEN
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bot-plc-secrets
                  key: OPENWEATHER_API_KEY
          # Désactivé car la feature n'est pas encore implémentée.
          # livenessProbe:
          #   exec:
          #     command:
          #       - /bin/sh
          #       - -c
          #       - test $(find /tmp/hearbeat -mmin -2)
          #   initialDelaySeconds: 10
          #   periodSeconds: 60