apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: toolbox
  labels:
    app.kubernetes.io/name: miniflux
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miniflux
    spec:
      securityContext:
        fsGroup: 1000
      dnsPolicy: ClusterFirst
      containers:
        - name: miniflux
          image: "ghcr.io/miniflux/miniflux@sha256:49d7b60987616387c306a8023087b31f2c9b7b21288b523026cb04058e8b6dbb" # 2.3.3
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 75m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          env:
            - name: HTTP_PROXY
              value: "http://10.0.23.1:3128"
            - name: HTTPS_PROXY
              value: "http://10.0.23.1:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc.cluster.local,10.42.0.0/16,10.0.0.0/8"
            - name: FETCHER_ALLOW_PRIVATE_NETWORKS
              value: "1"
            - name: RUN_MIGRATIONS
              value: "1"
            - name: OAUTH2_PROVIDER
              value: "oidc"
            - name: OAUTH2_OIDC_DISCOVERY_ENDPOINT
              value: "https://sso.loutik.fr/application/o/miniflux-prd/"
            - name: OAUTH2_REDIRECT_URL
              value: "http://rss.loutik.fr/oauth2/oidc/callback"
            - name: OAUTH2_USER_CREATION
              value: "1"
            - name: DISABLE_LOCAL_AUTH
              value: "1"
            - name: BASE_URL
              value: "https://rss.loutik.fr"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: DATABASE_URL
            - name: OAUTH2_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: OAUTH2_CLIENT_ID
            - name: OAUTH2_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: miniflux-secrets
                  key: OAUTH2_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
