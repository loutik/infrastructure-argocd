apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-louis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
    targetRevision: main
    path: apps/portfolio-louis
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true