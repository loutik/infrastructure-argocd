apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: docs-loutik
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
    targetRevision: HEAD
    path: apps/docs-loutik
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true