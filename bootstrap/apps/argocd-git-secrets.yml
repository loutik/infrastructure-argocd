apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: github-repo-creds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
    targetRevision: HEAD
    path: secrets/argocd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true