apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: portfolio-louis-updater
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-repo-creds"
    gitConfig:
      branch: "main"
      writeBackTarget: "kustomization"
  applicationRefs:
    - namePattern: "portfolio-louis"
      useAnnotations: false
      images:
        - alias: "bot"
          imageName: "ghcr.io/firetoak/portfolio-louis-medo"