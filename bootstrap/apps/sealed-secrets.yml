apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://bitnami.github.io/sealed-secrets'
    chart: sealed-secrets
    targetRevision: 2.19.0 # https://github.com/bitnami/sealed-secrets/blob/v0.38.4/helm/sealed-secrets/Chart.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true