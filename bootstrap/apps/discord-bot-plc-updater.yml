apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bot-plc
  namespace: argocd
spec:
  writeBackConfig:
    method: "git:secret:argocd/github-repo-creds"
    gitConfig:
      branch: "main"
      writeBackTarget: "kustomization"
  applicationRefs:
    - namePattern: "bot-plc"
      images:
        - alias: "bot"
          imageName: "ghcr.io/plc-btsio/discord-bot-plc"
          updateStrategy: "semver"