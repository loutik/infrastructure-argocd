apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-agent
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: prometheus
      targetRevision: 29.27.0
      helm:
        valueFiles:
          - $values/apps/monitoring/values.yml
    - repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true