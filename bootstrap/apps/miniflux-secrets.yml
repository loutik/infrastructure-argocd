apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: miniflux-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
    targetRevision: HEAD
    path: secrets/miniflux
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: toolbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true