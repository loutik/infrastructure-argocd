apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bot-plc-resources
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/loutik/infrastructure-argocd.git'
    targetRevision: HEAD
    path: secrets/discord-bot-plc
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: discord-bot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true